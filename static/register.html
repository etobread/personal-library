<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Моя библиотека</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Моя библиотека</h1>
    <p class="auth-subtitle">Создайте аккаунт</p>

    <form id="register-form">
      <label>Логин (от 3 до 30 символов)
        <input id="login" type="text" minlength="3" maxlength="30" autocomplete="username" required>
      </label>
      <label>Пароль (не менее 6 символов)
        <input id="password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required>
      </label>
      <label>Повторите пароль
        <input id="password-confirm" type="password" minlength="6" maxlength="72" autocomplete="new-password" required>
      </label>
      <button id="submit-btn" class="btn" type="submit">Зарегистрироваться</button>
      <p id="form-error" class="error" hidden></p>
    </form>

    <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
